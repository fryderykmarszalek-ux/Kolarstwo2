<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kolarstwo 2</title>
  <script>
    (function () {
      var style = ['swiat', 'trener', 'puls', 'feed', 'sciezka'], s = style[0];
      try { var z = localStorage.getItem('k2.styl'); if (style.indexOf(z) >= 0) s = z; } catch (e) {}
      location.replace('style/' + s + '/');
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f6f4; color: #16181d; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; }
    a { color: inherit; }
  </style>
</head>

    </p>
  </noscript>
</body>

<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kolarstwo 2</title>
  <style>
    :root { --bg: #f6f6f4; --fg: #16181d; --muted: #6b7079; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1114; --fg: #eef0f3; --muted: #8b919b; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg); padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { text-align: center; }
    h1 { font-size: clamp(2rem, 7vw, 3.5rem); margin: 0 0 .5rem; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Kolarstwo 2</h1>
    <p>Strona w budowie.</p>
  </main>
</body>
</html>

<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trener Pro · Kolarstwo</title>
  <meta name="theme-color" content="#F3F5F9">
  <link rel="stylesheet" href="wspolne/czcionki/plus-jakarta-sans.css?v=7">
  <link rel="stylesheet" href="wspolne/ikony/regular/style.css?v=7">
  <link rel="stylesheet" href="wspolne/ikony/fill/style.css?v=7">
  <link rel="stylesheet" href="wspolne/ikony/bold/style.css?v=7">
  <link rel="stylesheet" href="wspolne/web.css?v=8">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <div class="tp">
    <aside class="tp-bok">
      <a class="tp-logo" href="#pulpit" aria-label="Kolarstwo — pulpit">
        <span class="tp-logo-z" aria-hidden="true"><i class="ph-bold ph-bicycle"></i></span>
        <span><b>Kolarstwo</b><small>Trener</small></span>
      </a>
      <nav class="tp-nav" aria-label="Główne">
        <a href="#pulpit" data-widok="pulpit"><i class="ph ph-squares-four" aria-hidden="true"></i><span>Dzisiaj</span></a>
        <a href="#kalendarz" data-widok="kalendarz"><i class="ph ph-calendar-blank" aria-hidden="true"></i><span>Kalendarz</span></a>
        <a href="#jazdy" data-widok="jazdy"><i class="ph ph-list-bullets" aria-hidden="true"></i><span>Jazdy</span></a>
        <a href="#postepy" data-widok="postepy"><i class="ph ph-chart-line-up" aria-hidden="true"></i><span>Postępy</span></a>
      </nav>
      <div class="tp-bok-cel"></div>
      <button class="tp-bok-ja" type="button" aria-haspopup="dialog" aria-controls="tp-profil" aria-label="Athlete’s profile">
        <span class="tp-awatar" aria-hidden="true" data-profil="inicjaly">FM</span>
        <span class="tp-bok-ja-t"><b data-profil="pelne">Fryderyk Marszałek</b><small>Athlete’s profile</small></span>
        <i class="ph-bold ph-caret-right tp-bok-ja-s" aria-hidden="true"></i>
      </button>
    </aside>
    <div class="tp-tresc">
      <header class="tp-gora">
        <div class="tp-gora-t"></div>
        <div class="tp-gora-p"></div>
      </header>
      <main id="tresc"></main>
      <footer class="tp-stopka">Kolarstwo 2 · styl Trener Pro · dane przykładowe, segmenty i rekordy ze starej strony</footer>
    </div>
  </div>
  <!-- Okno „Athlete’s profile”: otwiera je pole w lewym dolnym rogu (.tp-bok-ja).
       Dwa widoki w JEDNYM oknie: profil i edycja (przełącza je kredka „Edit”). Kod: app.js. -->
  <dialog class="tp-okno" id="tp-profil" aria-labelledby="tp-profil-t" data-widok-okna="profil" tabindex="-1">
    <header class="tp-okno-g">
      <button class="tp-okno-wstecz" type="button" aria-label="Wróć do profilu bez zapisywania"><i class="ph-bold ph-caret-left" aria-hidden="true"></i></button>
      <!-- dotknięcie awatara w profilu powiększa go na środku ekranu (okno #tp-lupa) -->
      <button class="tp-okno-awatar-p" type="button" aria-label="Powiększ zdjęcie profilowe" aria-haspopup="dialog" aria-controls="tp-lupa"><span class="tp-awatar tp-okno-awatar" aria-hidden="true" data-profil="inicjaly">FM</span></button>
      <h2 id="tp-profil-t"><span class="tp-tyt-profil" data-profil="pelne">Fryderyk Marszałek</span><span class="tp-tyt-edycja">Edytuj profil</span></h2>
      <button class="tp-edytuj" type="button" aria-label="Edytuj profil">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12.6 3.9a1.6 1.6 0 0 1 2.3 0l1.2 1.2a1.6 1.6 0 0 1 0 2.3L7.4 16.1l-3.9.9.9-3.9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M11 5.5l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M11.5 17h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" opacity=".55"/></svg>
        <span>Edit</span>
      </button>
      <button class="tp-okno-x" type="button" aria-label="Zamknij"><i class="ph-bold ph-x" aria-hidden="true"></i></button>
    </header>
    <div class="tp-okno-tresc">
      <!-- widok 1: profil -->
      <!-- treść profilu dojdzie później; awatar, imię i nazwisko stoją w nagłówku okna -->
      <section class="tp-panel tp-panel-profil" aria-label="Athlete’s profile"></section>
      <!-- widok 2: edycja — imię, nazwisko, płeć; jeden „Zapisz” na dole zapisuje wszystko naraz -->
      <form class="tp-panel tp-panel-edycja" id="tp-profil-form" novalidate aria-label="Edycja profilu">
        <!-- zdjęcie profilowe: kredka otwiera okienko wyboru; podgląd od razu tutaj, reszta strony dopiero po „Zapisz” -->
        <div class="tp-osoba tp-osoba-edycja">
          <span class="tp-awatar tp-awatar-duzy" aria-hidden="true" data-podglad="inicjaly">FM</span>
          <button class="tp-zdj-kredka" type="button" aria-label="Zmień zdjęcie profilowe" aria-haspopup="dialog" aria-expanded="false" aria-controls="tp-zdj-menu">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15.4 4.2a2 2 0 0 1 2.8 0l1.6 1.6a2 2 0 0 1 0 2.8L8.6 19.8l-4.9 1.1 1.1-4.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13.4 6.2l4.4 4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button class="tp-zdj-usun" type="button" hidden><i class="ph ph-trash" aria-hidden="true"></i>Usuń profilowe</button>
          <div class="tp-zdj-menu" id="tp-zdj-menu" role="dialog" aria-label="Zmień zdjęcie profilowe" hidden>
            <p class="tp-zdj-menu-t">Zdjęcie profilowe</p>
            <label class="tp-zdj-wybierz">
              <input class="tp-zdj-plik" type="file" accept="image/*">
              <span class="tp-zdj-ik" aria-hidden="true"><i class="ph ph-image-square"></i></span>
              <span class="tp-zdj-opis"><b>Wybierz zdjęcie</b><small>Zdjęcia, Pliki albo aparat</small></span>
            </label>
          </div>
        </div>
        <p class="tp-blad tp-zdj-blad" id="tp-zdj-b" role="alert"></p>
        <div class="tp-pola">
          <div class="tp-pole">
            <div class="tp-pole-g"><label for="tp-imie">Imię</label><span class="tp-licznik" id="tp-imie-l" aria-live="polite">0/30</span></div>
            <input id="tp-imie" name="imie" type="text" maxlength="30" autocomplete="given-name" autocapitalize="words" spellcheck="false" enterkeyhint="next" aria-describedby="tp-imie-l tp-imie-b">
            <p class="tp-blad" id="tp-imie-b" role="alert"></p>
          </div>
          <div class="tp-pole">
            <div class="tp-pole-g"><label for="tp-nazwisko">Nazwisko</label><span class="tp-licznik" id="tp-nazwisko-l" aria-live="polite">0/30</span></div>
            <input id="tp-nazwisko" name="nazwisko" type="text" maxlength="30" autocomplete="family-name" autocapitalize="words" spellcheck="false" enterkeyhint="done" aria-describedby="tp-nazwisko-l tp-nazwisko-b">
            <p class="tp-blad" id="tp-nazwisko-b" role="alert"></p>
          </div>
        </div>
        <div class="tp-pole">
          <div class="tp-pole-g"><span id="tp-plec-t">Płeć</span></div>
          <div class="tp-plec" role="radiogroup" aria-labelledby="tp-plec-t">
            <button type="button" role="radio" data-plec="m">Mężczyzna</button>
            <i class="tp-plec-kropka" aria-hidden="true"></i>
            <button type="button" role="radio" data-plec="k">Kobieta</button>
            <i class="tp-plec-kropka" aria-hidden="true"></i>
            <button type="button" role="radio" data-plec="n">Niezdefiniowana</button>
          </div>
        </div>
        <!-- data urodzenia: dzień, miesiąc, rok — pusta = nieustawiona; wiek liczy się na żywo obok etykiety -->
        <div class="tp-pole">
          <div class="tp-pole-g"><span id="tp-ur-t">Data urodzenia</span><span class="tp-wiek" id="tp-wiek" aria-live="polite"></span></div>
          <div class="tp-data" role="group" aria-labelledby="tp-ur-t" aria-describedby="tp-ur-b">
            <input id="tp-ur-d" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="Dzień" aria-label="Dzień" autocomplete="bday-day" enterkeyhint="next">
            <span class="tp-data-m">
              <select id="tp-ur-m" aria-label="Miesiąc" autocomplete="bday-month">
              <option value="">Miesiąc</option>
              <option value="1">Styczeń</option>
              <option value="2">Luty</option>
              <option value="3">Marzec</option>
              <option value="4">Kwiecień</option>
              <option value="5">Maj</option>
              <option value="6">Czerwiec</option>
              <option value="7">Lipiec</option>
              <option value="8">Sierpień</option>
              <option value="9">Wrzesień</option>
              <option value="10">Październik</option>
              <option value="11">Listopad</option>
              <option value="12">Grudzień</option>
              </select>
              <i class="ph-bold ph-caret-down" aria-hidden="true"></i>
            </span>
            <input id="tp-ur-r" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Rok" aria-label="Rok" autocomplete="bday-year" enterkeyhint="done">
          </div>
          <p class="tp-blad" id="tp-ur-b" role="alert"></p>
        </div>
      </form>
    </div>
    <footer class="tp-okno-st">
      <p class="tp-okno-uwaga"><i class="ph ph-info" aria-hidden="true"></i>Zapis w tej przeglądarce</p>
      <button class="tp-przycisk" type="button" data-akcja="anuluj">Anuluj</button>
      <button class="tp-przycisk glowny" type="submit" form="tp-profil-form" disabled>Zapisz</button>
    </footer>
  </dialog>
  <!-- powiększone zdjęcie profilowe: samo kółko na środku; dotknięcie gdziekolwiek poza kółkiem zamyka -->
  <dialog class="tp-lupa" id="tp-lupa" aria-label="Zdjęcie profilowe" tabindex="-1">
    <span class="tp-awatar tp-lupa-a" data-profil="inicjaly">FM</span>
  </dialog>
  <script src="wspolne/dane.js?v=6"></script>
  <script src="wspolne/profil.js?v=3"></script>
  <script src="wspolne/wykresy.js?v=8"></script>
  <script src="wspolne/apka.js?v=6"></script>
  <script src="wspolne/web.js?v=8"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
